name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpcap-dev
      - name: Test
        run: cargo test
