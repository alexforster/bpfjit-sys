name: Release
run-name: Release ${{ inputs.bump }} version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require master branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Run this workflow from master."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native and release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpcap-dev libssl-dev pkg-config
          cargo install cargo-edit --version 0.13.12 --locked

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          cargo set-version --bump "$BUMP"
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "bpfjit-sys") | .version')"
          if git rev-parse --verify --quiet "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test

      - name: Verify package
        run: cargo publish --dry-run --allow-dirty

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "Release v${VERSION}"
          git tag --annotate "v${VERSION}" --message "Release v${VERSION}"
          git push origin HEAD:refs/heads/master "refs/tags/v${VERSION}"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
